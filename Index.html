<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustLogistics - Login</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{min-height:100vh;position:relative;display:flex;flex-direction:column}body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(7,25,50,0.9),rgba(7,25,50,0.84)),url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2000&auto=format&fit=crop');background-size:cover;background-position:center;z-index:-1}header{padding:18px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center} .brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;background:#fff;color:#0a2540;border-radius:12px;display:grid;place-items:center;font-size:20px}.wrap{flex:1;display:grid;place-items:center;padding:20px 16px}.card{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.4)}.tab{width:100%;background:#0a2540;color:#fff;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:800;font-size:12px;position:relative;margin:12px 0}.drop{position:absolute;top:110%;left:0;right:0;background:#fff;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.3);border:1px solid #e2e8f0;overflow:hidden;display:none;z-index:20}.drop.open{display:block}.dropItem{padding:14px 16px;font-size:11px;font-weight:800;color:#0a2540;cursor:pointer;border-bottom:1px solid #f1f5f9}.dropItem.active{background:#0a2540;color:#fff}.label{font-size:10px;font-weight:800;color:#334155;margin:12px 0 5px;display:block}.field{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;font-size:13px}.btn{width:100%;padding:13px;border-radius:12px;border:none;background:#0066ff;color:#fff;font-weight:800;font-size:13px;cursor:pointer;margin-top:16px}.err{background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px;font-size:11px;border:1px solid #fecaca;display:none;margin-bottom:8px}.hidden{display:none}</style></head><body><header><div class="brand"><div class="logo">🚚</div><div><b>TrustLogistics</b><div style="font-size:11px;opacity:.8">Live GPS • Secure Delivery</div></div></div><div style="font-size:11px;opacity:.8">UK Logistics Network</div></header><div class="wrap"><div class="card"><h3 style="text-align:center;color:#0a2540">Track Your Package</h3><p style="text-align:center;color:#64748b;font-size:11px;margin:6px 0 10px">Select package type to view requirements</p><div id="err" class="err"></div><div class="tab" onclick="toggleDrop()"><div>📦 PACKAGE TYPE</div><div id="arrow">▼</div><div class="drop" id="drop"><div class="dropItem active" onclick="pick(event,'VEHICLE')">📦 VEHICLE</div><div class="dropItem" onclick="pick(event,'GADGETS')">📱 GADGETS</div><div class="dropItem" onclick="pick(event,'CONSUMABLES')">🛒 CONSUMABLES</div></div></div><div id="f-VEHICLE"><label class="label">AWB / REFERENCE NUMBER</label><input id="awb" class="field" placeholder="Name/AA/001" autocomplete="off"><label class="label">VIN / IMEI CODE</label><input id="vin" class="field" placeholder="T00000/IMEI/0001" autocomplete="off"><button class="btn" id="loginBtn" onclick="doLogin()">Login → View Live Tracking</button></div><div id="f-GADGETS" class="hidden"><label class="label">GADGET AWB / REFERENCE</label><input class="field" placeholder="Name/GA/001"><label class="label">GADGET IMEI / SERIAL</label><input class="field" placeholder="T00000/IMEI/GADGET"><button class="btn" onclick="alert('Gadgets tracking coming soon')">Login → View Live Tracking</button></div><div id="f-CONSUMABLES" class="hidden"><label class="label">CONSUMABLE AWB / REFERENCE</label><input class="field" placeholder="Name/CN/001"><label class="label">BATCH / EXPIRY CODE</label><input class="field" placeholder="T00000/BATCH/0001"><button class="btn" onclick="alert('Consumables tracking coming soon')">Login → View Live Tracking</button></div></div></div><script>
function toggleDrop(){document.getElementById('drop').classList.toggle('open');document.getElementById('arrow').innerText=document.getElementById('drop').classList.contains('open')?'▲':'▼';}
function pick(e,type){e.stopPropagation();document.querySelectorAll('.dropItem').forEach(i=>i.classList.remove('active'));e.currentTarget.classList.add('active');document.getElementById('drop').classList.remove('open');document.getElementById('arrow').innerText='▼';document.getElementById('f-VEHICLE').classList.add('hidden');document.getElementById('f-GADGETS').classList.add('hidden');document.getElementById('f-CONSUMABLES').classList.add('hidden');document.getElementById('f-'+type).classList.remove('hidden');}
function showErr(m){const er=document.getElementById('err');er.innerText=m;er.style.display='block';}
function doLogin(){
 const awbEl=document.getElementById('awb'); const vinEl=document.getElementById('vin');
 const awb=awbEl.value.trim(); const vin=vinEl.value.trim();
 if(!awb||!vin){showErr('Please fill both fields');return;}

 // FIXED: Force exact match + case sensitive + GitHub path
 if(awb === 'Admin' && vin === 'Admin'){
   localStorage.setItem('trust_user','Admin');
   localStorage.setItem('trust_track','yes');
   // FIXED NAVIGATION FOR GITHUB PAGES
   window.location.href = './admin.html';
   return;
 }
 if(awb === 'Allan/DF/110' && (vin === 'H43245/IMEI/1001' || vin === 'H432456/IMEI/110')){
   localStorage.setItem('trust_user','Allan');
   localStorage.setItem('trust_awb','Allan/DF/110');
   localStorage.setItem('trust_vin',vin);
   localStorage.setItem('trust_track','yes');
   if(!localStorage.getItem('tl_shared_start_thornton')) localStorage.setItem('tl_shared_start_thornton', Date.now());
   window.location.href = './tracking.html';
   return;
 }
 showErr('Invalid! Use Admin/Admin or Allan/DF/110 / H43245/IMEI/1001 - Make sure VEHICLE is selected');
}
document.addEventListener('click',e=>{if(!e.target.closest('.tab')){document.getElementById('drop').classList.remove('open');document.getElementById('arrow').innerText='▼';}});
</script></body></html>
